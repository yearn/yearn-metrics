name: Python checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  UV_PYTHON_DOWNLOADS: never
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version-file: .python-version
      - run: python --version
      - run: python -m pip install uv==0.13.4
      - run: uv sync --locked --extra dev --python "${{ steps.python.outputs.python-path }}"
      - run: uv run --no-sync --python "${{ steps.python.outputs.python-path }}" python --version
      - run: uv run --no-sync --python "${{ steps.python.outputs.python-path }}" ruff check .
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: [pinned, minimum]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: yearn_test
          POSTGRES_PASSWORD: yearn_test
          POSTGRES_DB: yearn_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U yearn_test -d yearn_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      YEARN_TEST_POSTGRES_URL: postgresql://yearn_test:yearn_test@127.0.0.1:5432/yearn_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: ${{ matrix.python == 'minimum' && '3.10' || '' }}
          python-version-file: ${{ matrix.python == 'pinned' && '.python-version' || '' }}
      - run: python --version
      - run: python -m pip install uv==0.13.4
      - run: uv sync --locked --extra dev --python "${{ steps.python.outputs.python-path }}"
      - run: uv run --no-sync --python "${{ steps.python.outputs.python-path }}" python --version
      - run: uv run --no-sync --python "${{ steps.python.outputs.python-path }}" pytest -q
