name: Postgres tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: yearn_test
          POSTGRES_PASSWORD: yearn_test
          POSTGRES_DB: yearn_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U yearn_test -d yearn_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      YEARN_TEST_POSTGRES_URL: postgresql://yearn_test:yearn_test@127.0.0.1:5432/yearn_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install '.[dev]'
      - run: python -m pytest -q
